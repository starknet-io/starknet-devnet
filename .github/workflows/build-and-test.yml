name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format and Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load common configuration
        id: config
        uses: ./.github/actions/load-config

      - name: Set up Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.config.outputs.rust_nightly_version }}
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.config.outputs.node_lts_version }}
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@${{ steps.config.outputs.npm_version }}

      - name: Check code formatting
        run: make NIGHTLY_TOOLCHAIN=${{ steps.config.outputs.rust_nightly_version }} format-check
      
      - name: Check spelling
        run: make NIGHTLY_TOOLCHAIN=${{ steps.config.outputs.rust_nightly_version }} spelling

  web-ui-build:
    name: Web UI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load common configuration
        id: config
        uses: ./.github/actions/load-config

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.config.outputs.node_lts_version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@${{ steps.config.outputs.npm_version }}

      - name: Verify embedded web UI
        run: make web-ui

  website-build:
    name: Documentation Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load common configuration
        id: config
        uses: ./.github/actions/load-config

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.config.outputs.node_lts_version }}
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Pin npm version
        run: npm install -g npm@${{ steps.config.outputs.npm_version }}

      - name: Type-check and build documentation site
        run: make website

  clippy-and-unit-tests:
    name: Clippy and Unit Test
    runs-on: ubuntu-latest
    env:
      MLIR_SYS_190_PREFIX: /usr/lib/llvm-19
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      TABLEGEN_190_PREFIX: /usr/lib/llvm-19
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LLVM 19 (required for cairo_native)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-19 llvm-19-dev llvm-19-runtime \
            clang-19 clang-tools-19 lld-19 \
            libpolly-19-dev libmlir-19-dev mlir-19-tools

      - name: Load common configuration
        id: config
        uses: ./.github/actions/load-config

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.config.outputs.rust_stable_version }}
          components: clippy

      - name: Verify lockfile
        run: cargo update -w --locked

      - name: Run cargo check
        run: make check

      - name: Run clippy check
        run: make lint
      
      - name: Run tests
        run: make test

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      MLIR_SYS_190_PREFIX: /usr/lib/llvm-19
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      TABLEGEN_190_PREFIX: /usr/lib/llvm-19
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install LLVM 19 (required for cairo_native)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            llvm-19 llvm-19-dev llvm-19-runtime \
            clang-19 clang-tools-19 lld-19 \
            libpolly-19-dev libmlir-19-dev mlir-19-tools

      - name: Load common configuration
        id: config
        uses: ./.github/actions/load-config

      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.config.outputs.rust_stable_version }}

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/integration
          shared-key: ${{ runner.os }}-integration-test
          add-rust-environment-hash-key: "false"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.8.0
        with:
          version: nightly-5b7e4cb3c882b28f3c32ba580de27ce7381f415a

      - name: Build and run integration tests
        run: make integration
